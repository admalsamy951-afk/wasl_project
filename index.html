<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>وصل | إدارة طلبات التوصيل</title>

    <!-- ملفات التصميم -->
    <link rel="stylesheet" href="style.css">

    <!-- الخط العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-container">

        <!-- رأس الصفحة -->
        <header class="header">
            <div class="brand">

                <div class="brand-icon">
                    🚚
                </div>

                <div>
                    <h1>وصل</h1>
                    <p>إدارة طلبات التوصيل</p>
                </div>

            </div>
        </header>

        <!-- محتوى الصفحة -->
        <main class="main-content">

            <!-- عنوان الصفحة -->
            <section class="page-heading">
                <h2>طلبات التوصيل</h2>
                <p>متابعة وإدارة جميع طلبات الزبائن</p>
            </section>

            <!-- البحث -->
            <section class="search-section">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="ابحث باسم الزبون..."
                    autocomplete="off"
                >
            </section>

            <!-- ترتيب الطلبات -->
            <section class="sort-section">

                <label for="sortSelect">
                    ترتيب الطلبات حسب:
                </label>

                <select id="sortSelect">
                    <option value="newest">الأحدث أولًا</option>
                    <option value="oldest">الأقدم أولًا</option>
                    <option value="highest">المبلغ الأعلى</option>
                    <option value="lowest">المبلغ الأقل</option>
                </select>

            </section>

            <!-- إحصائيات الطلبات -->
            <section class="stats">

                <div class="stat-card">
                    <span>إجمالي الطلبات</span>
                    <strong id="totalOrders">0</strong>
                </div>

                <div class="stat-card">
                    <span>طلبات جديدة</span>
                    <strong id="newOrders">0</strong>
                </div>

                <div class="stat-card">
                    <span>تم التوصيل</span>
                    <strong id="deliveredOrders">0</strong>
                </div>

            </section>

            <!-- قائمة الطلبات -->
            <section class="orders-section">

                <div class="orders-heading">

                    <h3>قائمة الطلبات</h3>

                    <button id="refreshBtn" type="button">
                        تحديث الطلبات
                    </button>

                </div>

                <div id="ordersContainer">
                    <!-- الطلبات تظهر هنا -->
                </div>

            </section>

        </main>

    </div>

    <!-- ملف البرمجة -->
    <script src="script.js"></script>

</body>
</html>
